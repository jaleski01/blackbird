name: Blackbird Python Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install project dependencies
        run: python3.12 -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile Python sources
        run: python3.12 -m compileall -q api src

      - name: Run web and export checks
        run: |
          python3.12 -m unittest discover -s tests -p 'test_vercel_app.py'
          python3.12 -m unittest discover -s tests -p 'test_vercel_api.py'
          python3.12 -m unittest discover -s tests -p 'test_core.py'
          python3.12 -m unittest discover -s tests -p 'test_export.py'
